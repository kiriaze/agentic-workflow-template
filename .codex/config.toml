# Codex agent configuration for PROJECT_NAME
# https://github.com/openai/codex

# This model is the default for Codex running as Implementer.
# Full role-based model assignments for all roles and platforms live in
# docs/agent-roster.json — the single source of truth. When the orchestrator
# spawns Codex subagents it reads the roster; this value is the fallback when
# Codex runs directly (e.g. user opens Codex and loads this project).
# Either CC or Codex can fill any role — see docs/multi-agent.md.
model = "gpt-5.4"

[approval]
# Require approval before running shell commands
# "suggest" = suggest but don't auto-run, "auto-edit" = apply edits without approval
mode = "suggest"

[context]
# AGENTS.md is always loaded — it's the master rulebook, not a session brief.
# HANDOFF.md and docs/AGENT_TASKS.md are injected by .scripts/session-start.sh
# (the session-start hook), which both CC and Codex share.
always_include = [
  "AGENTS.md",
]

[context.ignore]
# Never index or read these paths
paths = [
  "node_modules",
  ".next",
  "dist",
  "coverage",
  ".git",
  "*.lock",
  "*.tsbuildinfo",
]

[session]
# Keep sessions under the 272K token ceiling to avoid cost doubling.
# See docs/multi-agent.md for task scoping guidance.
warn_at_tokens = 220000

[agent]
# Personal preference, you're free to edit. I just don't like AI hijacking my computer/apps when it can use it's built-in browser (browser-use)
computer_use = false